<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Serge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0A1230;color:#F2F5FF;font:16px/1.5 system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:30px;text-transform:uppercase}h2{margin:0;font-size:20px}p{margin:0}
.card{background:#15245A;border:1px solid #2D3F85;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#AEBBE0}
input,select,textarea{font:inherit;color:#F2F5FF;background:#0F1B4A;border:1px solid #2D3F85;border-radius:12px;padding:12px;width:100%}
button{font:700 16px system-ui,sans-serif;min-height:48px;border:0;border-radius:14px;background:#FF6B1A;color:#0B1530;padding:0 16px}
button.alt{background:#0F1B4A;color:#F2F5FF;border:1px solid #2D3F85}
button:disabled{opacity:.5}
.row{text-align:left;display:flex;flex-direction:column;padding:12px 16px;height:auto}
.muted{color:#AEBBE0;font-size:14px}.err{background:#43171D;color:#FFB3BA;border-radius:12px;padding:12px}
.ok{background:#0F3A36;color:#7CE8D3;border-radius:12px;padding:12px}
code{word-break:break-all;user-select:all;background:#0F1B4A;padding:8px;border-radius:8px}
</style>
</head>
<body>
<main id="app"><p>Chargement…</p></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs, getDocsFromServer, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

// Configuration publique de l'application web (ce n'est pas un mot de passe).
const app = initializeApp({
  apiKey: "AIzaSyDq9x7iJ62j9ScseySYmyRfiIlNWEiDhqc",
  authDomain: "coach-serge.firebaseapp.com",
  projectId: "coach-serge",
  storageBucket: "coach-serge.firebasestorage.app",
  messagingSenderId: "736900684558",
  appId: "1:736900684558:web:26743686b2cd7bf4d0555f"
});
const auth = getAuth(app), db = getFirestore(app);
const OBJ = {perte:'Perte de poids',masse:'Prise de masse',muscle:'Gain de muscle',irock:'iRock',tonif:'Fessiers et tonification'};
const $app = document.getElementById('app');
let user = null, coach = false;

// Les textes saisis passent toujours par textContent : aucun code injecté.
function el(tag, props = {}, ...kids){
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter(Boolean));
  return n;
}
function show(...nodes){ $app.replaceChildren(el('h1',{textContent:'Coach Serge'}), ...nodes.filter(Boolean)); }
const btn = (text, onclick, cls = '') => el('button',{type:'button',textContent:text,onclick,className:cls});
const note = (text, cls = 'muted') => el('p',{textContent:text,className:cls});
function fail(e, retry){
  console.error(e);
  show(note(e && e.code === 'permission-denied'
    ? "Accès refusé. Les règles de la base ne sont peut-être pas encore publiées."
    : "Un problème est survenu (" + ((e && e.code) || 'inconnu') + "). Vérifie ta connexion Internet.", 'err'),
    btn('Réessayer', retry), user && btn('Se déconnecter', () => signOut(auth), 'alt'));
}
function loginScreen(msg){
  show(msg && note(msg,'err'), el('div',{className:'card'},
    note('Connecte-toi pour accéder à ton suivi.'),
    btn('Continuer avec Google', async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch(e){ loginScreen("Connexion impossible (" + (e.code || 'inconnu') + ")."); }
    })));
}
function account(){
  return el('div',{className:'card'},
    note('Connecté : ' + user.email),
    el('details',{}, el('summary',{textContent:'Mon identifiant'}), el('code',{textContent:user.uid})),
    btn('Se déconnecter', () => signOut(auth), 'alt'));
}
function form(id, data, saved){
  const field = (label, node) => el('label',{}, label, node);
  const nom = el('input',{value:data.nom || '',maxLength:80});
  const tel = el('input',{value:data.telephone || '',maxLength:30,type:'tel'});
  const obj = el('select',{}, ...Object.entries(OBJ).map(([v,t]) => el('option',{value:v,textContent:t})));
  obj.value = data.objectif || 'perte';
  const msg = el('textarea',{value:data.message || '',maxLength:500,rows:3});
  const status = el('p');
  const save = btn('Enregistrer', async () => {
    if(!nom.value.trim()){ status.className='err'; status.textContent='Écris le nom.'; return; }
    save.disabled = true; status.className='muted'; status.textContent='Enregistrement…';
    const fiche = {nom:nom.value.trim(), telephone:tel.value.trim(), objectif:obj.value, message:msg.value.trim(),
      email: data.email ?? (id === user.uid ? user.email : ''), majLe: serverTimestamp()};
    try {
      if(id) await setDoc(doc(db,'clients',id), fiche); else await addDoc(collection(db,'clients'), fiche);
      saved();
    } catch(e){ status.className='err'; status.textContent="Non enregistré (" + (e.code || 'inconnu') + ")."; save.disabled=false; }
  });
  return el('div',{className:'card'}, field('Nom et prénom',nom), field('Téléphone',tel), field('Objectif',obj),
    field('Message pour le coach',msg), save, status);
}
async function clientHome(done){
  try {
    const snap = await getDoc(doc(db,'clients',user.uid));
    show(done && note('Fiche enregistrée.','ok'), el('h2',{textContent:'Ma fiche'}),
      form(user.uid, snap.exists() ? snap.data() : {nom:user.displayName || ''}, () => clientHome(true)), account());
  } catch(e){ fail(e, () => clientHome()); }
}
// Un texte qui commence comme une formule est neutralisé avant d'aller dans le tableau.
function cellule(v){
  let t = String(v ?? '');
  if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;
  return '"' + t.replaceAll('"','""') + '"';
}
function boutonSauvegarde(){
  const status = el('p',{className:'muted'});
  const b = btn('Télécharger une sauvegarde', async () => {
    b.disabled = true; status.className = 'muted'; status.textContent = 'Préparation…';
    try {
      // Lecture sur le serveur : jamais une ancienne copie gardée par le téléphone.
      const snap = await getDocsFromServer(collection(db,'clients'));
      if(!snap.docs.length){ status.textContent = 'Aucune fiche à sauvegarder.'; return; }
      const lignes = [['Nom','Téléphone','Objectif','Message','E-mail','Dernière mise à jour','Code de la fiche']];
      for(const d of snap.docs){
        const c = d.data();
        lignes.push([c.nom, c.telephone, OBJ[c.objectif] || c.objectif, c.message, c.email,
          c.majLe?.toDate ? c.majLe.toDate().toISOString() : '', d.id]);
      }
      const texte = '\ufeff' + lignes.map(l => l.map(cellule).join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob([texte], {type:'text/csv;charset=utf-8'}));
      const nomFichier = 'sauvegarde-coach-serge-' + new Date().toISOString().slice(0,10) + '.csv';
      el('a',{href:url, download:nomFichier}).click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      status.className = 'ok';
      status.textContent = 'Sauvegarde préparée (' + snap.docs.length + ' fiche(s)) : ' + nomFichier + '. Vérifie le dossier Téléchargements. Ce fichier est privé.';
    } catch(e){ status.className = 'err'; status.textContent = 'Sauvegarde impossible (' + (e.code || 'inconnu') + '). Vérifie Internet.'; }
    finally { b.disabled = false; }
  }, 'alt');
  return el('div',{className:'card'}, b, status);
}
async function coachHome(done){
  try {
    const snap = await getDocs(collection(db,'clients'));
    const list = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => a.nom.localeCompare(b.nom,'fr'));
    show(done && note(done,'ok'), el('h2',{textContent:'Mes clients (' + list.length + ')'}),
      btn('+ Ajouter un client', () => coachEdit(null, {})),
      !list.length && note('Aucun client pour le moment. Commence avec un faux client.'),
      ...list.map(c => {
        const b = btn('', () => coachEdit(c.id, c), 'alt row');
        b.append(el('span',{textContent:c.nom}), el('span',{textContent:OBJ[c.objectif] || '',className:'muted'}));
        return b;
      }), boutonSauvegarde(), account());
  } catch(e){ fail(e, () => coachHome()); }
}
function coachEdit(id, data){
  let sure = false;
  const del = id && btn('Supprimer cette fiche', async () => {
    if(!sure){ sure = true; del.textContent = 'Toucher encore pour confirmer'; return; }
    try { await deleteDoc(doc(db,'clients',id)); coachHome('Fiche supprimée.'); } catch(e){ fail(e, () => coachHome()); }
  }, 'alt');
  show(btn('← Retour', () => coachHome(), 'alt'), el('h2',{textContent:id ? 'Fiche client' : 'Nouveau client'}),
    form(id, data, () => coachHome('Fiche enregistrée.')), del);
}
async function start(){
  if(!user) return loginScreen();
  show(note('Chargement…'));
  try {
    coach = (await getDoc(doc(db,'admins',user.uid))).exists();
    coach ? coachHome() : clientHome();
  } catch(e){ fail(e, start); }
}
onAuthStateChanged(auth, u => { user = u; start(); });
</script>
</body>
</html>
